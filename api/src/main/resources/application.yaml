spring:
  application:
    name: ERP_FinalProject
# La datasource est découverte depuis compose.yaml (spring-boot-docker-compose).
# Pour viser une base externe : spring.docker.compose.enabled=false + spring.datasource.*
#  datasource:
#    url: ${DB_URL}
#    username: ${DB_USERNAME}
#    password: ${DB_PASSWORD}
#    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
erp:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600
  cors:
    allowed-origins: http://localhost:4200
